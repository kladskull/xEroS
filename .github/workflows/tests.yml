name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, mbstring, pdo_sqlite, sqlite3, xml, zip, sockets, zlib, openssl, pcntl
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: cp .env_sample .env

      - run: ./phinx migrate

      - run: vendor/bin/phpunit --bootstrap bootstrap.php tests
